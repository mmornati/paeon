name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_LOCKED: "1"
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: 0.13.6
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Lint, types, tests
    # GitHub-hosted runners only: a public repository must never run on a self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          cache-python: true
      - run: uv lock --check
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest --cov

  image:
    name: Image
    needs: check
    # The push step holds a packages:write token, so this job stays on a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push ghcr.io/<owner>/paeon on main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          set -euo pipefail
          docker build \
            --build-arg "VERSION=sha-${GITHUB_SHA::7}" \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --tag "${IMAGE}:sha-${GITHUB_SHA::7}" --tag "${IMAGE}:edge" .
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE}:edge" --version
          # Without a token the service must refuse to start.
          if docker run --rm "${IMAGE}:edge" serve; then
            echo "serve started without PAEON_INGEST_TOKEN" >&2
            exit 1
          fi
      - name: Push (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}:sha-${GITHUB_SHA::7}"
          docker push "${IMAGE}:edge"
