name: Release

# A release is a tag `vX.Y.Z` pushed on a commit of main. The tag must say what the code says
# (`__version__`) and the changelog must have that version's section: it becomes the notes.
# Then the same checks as CI, the image under its version, and the GitHub release.
on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  UV_LOCKED: "1"
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: 0.13.6
  IMAGE: ghcr.io/${{ github.repository }}
  TAG: ${{ github.ref_name }}

jobs:
  check:
    name: Version, changelog, lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the other tags, and main, to place this one
      - name: The tag, the code and the changelog agree
        id: version
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::${TAG} is not vX.Y.Z or vX.Y.Z-suffix"; exit 1
          fi
          code="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/paeon/__init__.py)"
          if [[ "${code}" != "${version}" ]]; then
            echo "::error::the tag says ${version}, src/paeon/__init__.py says ${code}"; exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${TAG} is not on main"; exit 1
          fi
          # The section of this version, up to the next one. `(unreleased)` in its heading is
          # tolerated: the tag is what releases it.
          awk -v v="${version}" '
            /^## / { on = ($2 == v) ; next }
            on
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${version}"; exit 1
          fi
          prerelease=false
          if [[ "${version}" == *-* ]]; then prerelease=true; fi
          # `latest` follows the highest version, not the last one tagged (a fix of an old line).
          highest="$(git tag --list 'v[0-9]*' | { grep -v -e '-' || true; } | sort -V | tail -n 1)"
          latest=false
          if [[ "${prerelease}" == false && "${highest}" == "${TAG}" ]]; then latest=true; fi
          {
            echo "version=${version}"
            echo "prerelease=${prerelease}"
            echo "latest=${latest}"
          } >> "${GITHUB_OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: notes
          path: notes.md
          retention-days: 1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false # a release is built from nothing an earlier run left
      - run: uv lock --check
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest --cov

  image:
    name: Image
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push ghcr.io/<owner>/paeon:<version>
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      LATEST: ${{ needs.check.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          set -euo pipefail
          docker build \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --tag "${IMAGE}:${VERSION}" .
      - name: Smoke test
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE}:${VERSION}" --version
          if docker run --rm "${IMAGE}:${VERSION}" serve; then
            echo "serve started without PAEON_INGEST_TOKEN" >&2
            exit 1
          fi
          if docker run --rm "${IMAGE}:${VERSION}" executor; then
            echo "executor started without PAEON_EXECUTOR_TOKEN" >&2
            exit 1
          fi
      - name: Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}:${VERSION}"
          if [[ "${PRERELEASE}" == false ]]; then
            minor="${VERSION%.*}" # 0.1.2 -> 0.1: the line that receives fixes
            docker tag "${IMAGE}:${VERSION}" "${IMAGE}:${minor}"
            docker push "${IMAGE}:${minor}"
          fi
          if [[ "${LATEST}" == true ]]; then
            docker tag "${IMAGE}:${VERSION}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          fi

  release:
    name: GitHub release
    needs: [check, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the release of this tag
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
      LATEST: ${{ needs.check.outputs.latest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notes
      - name: Create the release, or bring an existing one up to date
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # the backticks are markdown, not a command
          printf '\n## Image\n\n```\ndocker pull %s:%s\n```\n' "${IMAGE}" "${VERSION}" >> notes.md
          flags=(--title "${TAG}" --notes-file notes.md "--prerelease=${PRERELEASE}" "--latest=${LATEST}")
          # A release drafted by hand in the UI also pushes the tag: it exists already.
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release edit "${TAG}" "${flags[@]}"
          else
            gh release create "${TAG}" --verify-tag "${flags[@]}"
          fi
