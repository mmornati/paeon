global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: demo-app
    static_configs:
      - targets: ["demo-app:9091"]
        labels: { instance: quickstart-host, service: demo-app }
