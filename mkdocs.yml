# Documentation site (MkDocs Material). Built by scripts/build-site.sh: the landing page (website/) at
# the root of https://mmornati.github.io/paeon/ and this documentation, from docs/, under /docs/. The
# Markdown in docs/ stays readable on GitHub as it is; scripts/mkdocs_hooks.py rewrites the few links
# that point outside docs/ (examples, source files) to the repository on GitHub at build time.

site_name: Paeon
site_description: "Alert triage, read-only investigation and approved remediation for a self-hosted server, with a hard line between what a model may think and what code may do."
site_author: Marco Mornati
site_url: https://mmornati.github.io/paeon/docs/

repo_name: mmornati/paeon
repo_url: https://github.com/mmornati/paeon
edit_uri: edit/main/docs/

copyright: >-
  Licensed under the Apache License, Version 2.0. Every incident, host and finding in the examples is
  fictional. Not affiliated with OpenObserve, uptime-kuma, Prometheus, Docker, ntfy, Anthropic or OpenAI.

theme:
  name: material
  language: en
  font: false
  logo: assets/mark.svg
  favicon: assets/mark.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra:
  homepage: https://mmornati.github.io/paeon/
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mmornati/paeon

extra_css:
  - https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap
  - stylesheets/extra.css

hooks:
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Get started:
      - Quickstart: quickstart.md
      - With Prometheus and Docker: quickstart-prometheus.md
      - Connect your alerts: connect-alerts.md
      - Videos: videos.md
  - How it works:
      - The pipeline: how-it-works.md
      - Privacy and safety: privacy-and-safety.md
      - Threat model: threat-model.md
      - Design document: llm-incident-response-architecture.md
  - Guides:
      - Configuration: configuration.md
      - The console: console.md
      - Acting: acting.md
  - Reference:
      - Command line, API and MCP: cli-and-api.md
      - Roadmap and limits: roadmap.md
