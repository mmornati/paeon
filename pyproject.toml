[project]
name = "paeon"
dynamic = ["version"]
description = "Alert triage, investigation and approved remediation for self-hosted servers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1,<2",
    "fastapi>=0.115",
    "httpx2>=2.16,<3",
    "jinja2>=3.1",
    "pydantic>=2.9",
    "python-multipart>=0.0.20",
    "pyyaml>=6",
    "tzdata>=2024.1",
    "uvicorn>=0.30",
]

[project.scripts]
paeon = "paeon.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/paeon/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/paeon"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.12"
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["paeon"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
